<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Десерты</title>
    <link rel="stylesheet" href="css/dessert.css" />
  </head>
  <body>
    <div id="dessertquestion">А на десертик бы что слопала?</div>

    <div class="dessert-selection">
      <div class="dessert-item">
        <img src="food/pims.jpeg" alt="pims" />
        <label
          ><input type="checkbox" name="dessert" value="boba" /> пимс</label
        >
      </div>
      <div class="dessert-item">
        <img src="food/churro.jpeg" alt="churro" />
        <label
          ><input type="checkbox" name="dessert" value="churro" /> чуррос</label
        >
      </div>
      <div class="dessert-item">
        <img src="food/icecream.webp" alt="che" />
        <label
          ><input type="checkbox" name="dessert" value="che" /> мороженое</label
        >
      </div>
      <div class="dessert-item">
        <img src="food/cake.jpeg" alt="mochi" />
        <label
          ><input type="checkbox" name="dessert" value="mochi" /> тортик</label
        >
      </div>
      <div class="dessert-item">
        <img src="food/macarons.webp" alt="randombun" />
        <label
          ><input type="checkbox" name="dessert" value="randombun" />
          макаронс</label
        >
      </div>
      <div class="dessert-item">
        <img src="food/waffles.jpeg" alt="taiyaki" />
        <label
          ><input type="checkbox" name="dessert" value="taiyaki" />
          вафелька</label
        >
      </div>
    </div>
    <button class="button" onclick="location.href='activities2.html'">
      Продолжить
    </button>
  </body>
</html>
